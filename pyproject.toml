[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileaudit"
version = "0.1.0"
description = "A local-first file collection auditing tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
fileaudit = "fileaudit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]